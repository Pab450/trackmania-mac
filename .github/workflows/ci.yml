name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint tm
        run: shellcheck tm
      - name: Install mingw-w64 and Wine
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 wine64
      - name: Build the fastread shim
        run: |
          x86_64-w64-mingw32-gcc -Wall -Wextra -Werror -O2 -shared -s -static-libgcc \
            -o dinput8.dll fastread/fastread.c fastread/dinput8.def
          marker="$(sed -n 's/^FASTREAD_MARKER="\([^"]*\)".*/\1/p' tm)"
          grep -qF "$marker" dinput8.dll
      - name: Test
        run: python3 -m unittest discover -v tests
